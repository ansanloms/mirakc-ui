name: mirakc-ui

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/base:bookworm
    entrypoint: []
    command: ["sleep", "infinity"]
    environment:
      MIRAKC_URL: ${MIRAKC_URL}
      # 日時整形のタイムゾーン。未設定なら UTC (空文字は Etc/Unknown になるため
      # 明示デフォルトを置く)。.devcontainer/.env で TZ=Asia/Tokyo 等を指定する。
      TZ: ${TZ:-UTC}

  app:
    build:
      context: ${WORK_DIR:-.}/..
      dockerfile: Dockerfile
    entrypoint: []
    init: true
    # package-lock.json・package.json・.npmrc のハッシュを node_modules (named
    # volume) に記録し、前回のインストールから変わっていなければ npm ci を飛ばす。
    # npm ci や記録の書き込みに失敗したら起動せず非 0 で終わる。最後は exec で dev
    # サーバに置き換え、init 経由のシグナルを直接受けさせる。
    command:
      [
        "sh",
        "-c",
        "sha256sum -c node_modules/.install.sha256 >/dev/null 2>&1 || { npm ci --include=dev && sha256sum package-lock.json package.json .npmrc > node_modules/.install.sha256; } && exec npm run dev",
      ]
    volumes:
      - ${WORK_DIR:-.}/..:/app
      - node_modules:/app/node_modules
      # 設定系データ (SQLite)。ホスト側のリポジトリを汚さず、
      # コンテナ再作成をまたいで永続化するため named volume にする。
      - data:/app/data
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      # 最終ステージの ENV NODE_ENV=production を打ち消す (production のままだと
      # npm ci が devDependencies を省き、Vite が起動しない)。
      NODE_ENV: development
      MIRAKC_URL: ${MIRAKC_URL}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
      # 録画通知・録画ファイル名の日時整形に使う。未設定なら UTC (空文字は
      # Etc/Unknown になるため明示デフォルトを置く)。.devcontainer/.env で指定する。
      TZ: ${TZ:-UTC}

volumes:
  node_modules:
  data:
