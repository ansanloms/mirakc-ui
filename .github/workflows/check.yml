name: Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# PR は同じ ref の古い実行をキャンセルする。main への push はコミットごとに group を分け、全コミットの検証結果を残す
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  root:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # client/routeTree.gen.ts (gitignore 対象の生成物) が無いと型検査が落ちるため、check より先に build する
      - name: Build
        run: npm run build

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build Storybook
        run: npm run storybook:build

      # package-lock.json など追跡対象のファイルが検証中に書き換わっていないこと
      - name: Check for uncommitted changes
        run: git diff --exit-code

  docs-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: docs/api/.node-version
          cache: npm
          cache-dependency-path: docs/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # server/lib/api/internal-schemas.ts が docs/api の OpenAPI から再生成した内容と一致すること
      - name: Generate server schemas
        run: |
          npm run bundle:json
          npm run emit-server-schemas -- ../../server/lib/api/internal-schemas.ts

      - name: Check for uncommitted changes
        run: git diff --exit-code
